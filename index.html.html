<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블록 퍼즐 테트리스</title><style>body{margin:0;background:#101326;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:20px}main{text-align:center}h1{margin:4px 0 12px}section{display:flex;gap:18px;align-items:flex-start;justify-content:center}canvas{background:#080b18;border:3px solid #64748b;border-radius:6px;max-width:65vw}aside{min-width:110px;text-align:left}#next{width:100px;height:100px;max-width:none}button{background:#334155;color:white;border:1px solid #64748b;border-radius:8px;padding:12px;font-size:16px;cursor:pointer}button:hover{background:#475569}.controls{margin:14px auto;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.controls button{min-width:52px;touch-action:manipulation}small{color:#cbd5e1;display:block;margin-top:10px}</style></head><body><main><h1>🧩 테트리스</h1><section><canvas id="board" width="300" height="600"></canvas><aside><p>점수<br><strong id="score">0</strong></p><p>줄<br><strong id="lines">0</strong></p><p>레벨<br><strong id="level">1</strong></p><p>다음 블록</p><canvas id="next" width="100" height="100"></canvas><p><button id="start">시작 / 재시작</button></p><p><button id="pause">일시정지</button></p></aside></section><div class="controls"><button data-key="ArrowLeft">⬅️</button><button data-key="ArrowDown">⬇️</button><button data-key="ArrowRight">➡️</button><button data-key="ArrowUp">🔄</button><button data-key="Space">⏬</button></div><small>← → 이동 · ↑ 회전 · ↓ 빠르게 · 스페이스 즉시 내리기 · P 일시정지</small><p id="message" aria-live="polite">시작 버튼을 눌러주세요!</p></main><script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),preview=document.querySelector('#next').getContext('2d');const W=10,H=20,S=30,colors=['','#38bdf8','#facc15','#c084fc','#4ade80','#fb7185','#60a5fa','#fb923c'];const shapes=[null,[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];let grid,piece,nextType,score,lines,level,running=false,paused=false,last=0,acc=0,raf=0;const $=id=>document.getElementById(id);function newGrid(){return Array.from({length:H},()=>Array(W).fill(0))}function randomType(){return 1+Math.floor(Math.random()*7)}function spawn(){const type=nextType;nextType=randomType();piece={m:shapes[type].map(row=>row.slice()),x:3,y:0};piece.x=Math.floor((W-piece.m[0].length)/2);drawNext();if(collides(piece.m,piece.x,piece.y)){running=false;$('message').textContent='게임 오버! 다시 시작해보세요.'}}function collides(m,x,y){return m.some((row,dy)=>row.some((v,dx)=>v&&(x+dx<0||x+dx>=W||y+dy>=H||(y+dy>=0&&grid[y+dy][x+dx]))))}function move(dx,dy){if(!running||paused)return false;if(!collides(piece.m,piece.x+dx,piece.y+dy)){piece.x+=dx;piece.y+=dy;return true}if(dy)lock();return false}function rotate(){if(!running||paused)return;const m=piece.m[0].map((_,i)=>piece.m.map(row=>row[i]).reverse());for(const offset of [0,-1,1,-2,2])if(!collides(m,piece.x+offset,piece.y)){piece.m=m;piece.x+=offset;break}}function lock(){piece.m.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=v}));let cleared=0;for(let y=H-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(W).fill(0));cleared++;y++}if(cleared){score+=[0,100,300,500,800][cleared]*level;lines+=cleared;level=1+Math.floor(lines/10);update()}spawn()}function hardDrop(){if(!running||paused)return;let n=0;while(!collides(piece.m,piece.x,piece.y+1)){piece.y++;n++}score+=n*2;update();lock()}function update(){$('score').textContent=score;$('lines').textContent=lines;$('level').textContent=level}function cell(c,x,y,v,size){c.fillStyle=colors[v];c.fillRect(x*size+1,y*size+1,size-2,size-2);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x*size+3,y*size+3,size-6,3)}function drawNext(){preview.clearRect(0,0,100,100);const m=shapes[nextType],size=22,ox=(100-m[0].length*size)/2,oy=(100-m.length*size)/2;m.forEach((row,y)=>row.forEach((v,x)=>{if(v){preview.fillStyle=colors[v];preview.fillRect(ox+x*size+1,oy+y*size+1,size-2,size-2)}}))}function draw(){ctx.clearRect(0,0,300,600);ctx.fillStyle='#080b18';ctx.fillRect(0,0,300,600);grid.forEach((row,y)=>row.forEach((v,x)=>{if(v)cell(ctx,x,y,v,S)}));if(piece)piece.m.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)cell(ctx,piece.x+x,piece.y+y,v,S)}));if(paused){ctx.fillStyle='#000a';ctx.fillRect(0,0,300,600);ctx.fillStyle='white';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText('일시정지',150,300)}}function loop(t){const delta=Math.min(t-last,100);last=t;if(running&&!paused){acc+=delta;if(acc>Math.max(90,750*Math.pow(.83,level-1))){move(0,1);acc=0}}draw();raf=requestAnimationFrame(loop)}function start(){grid=newGrid();score=0;lines=0;level=1;piece=null;nextType=randomType();running=true;paused=false;acc=0;last=performance.now();update();spawn();$('message').textContent='블록을 쌓아 가로줄을 완성하세요!';draw()}function action(key){if(key==='KeyP'){if(running){paused=!paused;$('message').textContent=paused?'일시정지 중':'게임 진행 중'}return}if(key==='ArrowLeft')move(-1,0);else if(key==='ArrowRight')move(1,0);else if(key==='ArrowDown'){if(move(0,1)){score++;update()}}else if(key==='ArrowUp')rotate();else if(key==='Space')hardDrop();draw()}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space','KeyP'].includes(e.code)){e.preventDefault();action(e.code)}});document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.key)));$('start').onclick=start;$('pause').onclick=()=>action('KeyP');grid=newGrid();draw();raf=requestAnimationFrame(loop);
</script></body></html>
